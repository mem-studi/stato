<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda studi</title>
<style>
body{font-family:Arial,sans-serif;margin:20px;background:#f7f8fa;color:#222}
h1{font-size:22px;margin:0 0 14px}
.controls{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
select,button,input[type=file]{padding:7px 10px;border:1px solid #bbb;border-radius:6px;background:white}
button{cursor:pointer}
button:hover{background:#eef1f5}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:10px 0 16px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:13px}
.swatch{width:14px;height:14px;border-radius:3px;border:1px solid #999}
.table-wrap{overflow:auto;background:white;border:1px solid #d6d9dd;border-radius:8px;box-shadow:0 1px 3px #0001}
table{border-collapse:collapse;min-width:1150px;width:100%;table-layout:fixed}
th,td{border:1px solid #dfe3e8;text-align:center}
th{background:#eef1f5;padding:7px 3px}
th.study,td.study{width:72px;position:sticky;left:0;z-index:3}
td.study{font-weight:700;background:#f3f5f7}
.day-head{min-width:54px}
.cell{height:92px;padding:3px;vertical-align:top;position:relative}
.booking{border-radius:5px;color:white;padding:5px 4px;margin:2px 0;font-size:11px;line-height:1.15;cursor:pointer;box-shadow:0 1px 2px #0002}
.booking .time{font-size:10px;margin-top:3px;font-weight:600}
.tooltip{position:fixed;display:none;z-index:1000;background:#222;color:#fff;padding:8px 10px;border-radius:6px;font-size:12px;line-height:1.4;box-shadow:0 4px 14px #0004;pointer-events:none}
.note{color:#666;font-size:12px;margin-top:10px}
.status{font-size:13px;color:#444}
.hint{font-size:13px;color:#8a6d00;background:#fff8e1;border:1px solid #ffe082;padding:8px 10px;border-radius:6px;margin:8px 0}
textarea{width:100%;height:120px;font-family:monospace;font-size:12px}
</style></head>
<body>
<h1>Agenda studi</h1>

<div class="controls">
  <label><b>Mese:</b> <select id="monthSelect"></select></label>
  <label><b>Carica CSV:</b> <input type="file" id="fileInput" accept=".csv,text/csv"></label>
  <span id="summary" class="status"></span>
</div>

<div id="hint" class="hint" style="display:none"></div>

<!-- Fallback: mostra solo se il caricamento automatico fallisce -->
<div id="fallback" style="display:none;margin:10px 0;padding:10px;border:1px dashed #c00;border-radius:6px;background:#fff5f5">
  <div style="margin-bottom:6px;color:#c00"><b>Impossibile leggere automaticamente <code>dati.csv</code>.</b></div>
  <div style="margin-bottom:6px">Seleziona il file con "Carica CSV", oppure incolla qui sotto il contenuto del CSV (intestazione inclusa):</div>
  <textarea id="pasteArea" placeholder="Data;Mese;Operatore;Dalle;Alle;Studio;..."></textarea>
  <button id="pasteBtn" style="margin-top:6px">Elabora testo incollato</button>
</div>

<div class="legend" id="legend"></div>
<div class="table-wrap"><table id="agenda"></table></div>
<div class="tooltip" id="tooltip"></div>
<div class="note">Ogni nominativo occupa uno slot colorato nello studio e nel giorno corrispondente. Passa con il mouse sopra lo slot per i dettagli.</div>

<script>
/* =======================
   1) COLORI PER OPERATORE
   ======================= */
const palette = ["#4E79A7","#F28E2B","#E15759","#76B7B2","#59A14F","#EDC948","#B07AA1","#FF9DA7","#9C755F","#BAB0AC","#8CD17D","#86BCB6","#F1CE63","#D4A6C8","#499894"];
const colorByName = {};
function colorFor(name){
  if(!name) return "#4E79A7";
  if(!colorByName[name]){
    const idx = Object.keys(colorByName).length % palette.length;
    colorByName[name] = palette[idx];
  }
  return colorByName[name];
}

/* =======================
   2) STATO
   ======================= */
let records = [];
let monthOptions = [];

const ms = document.getElementById('monthSelect');
const legend = document.getElementById('legend');
const table = document.getElementById('agenda');
const tip = document.getElementById('tooltip');
const summary = document.getElementById('summary');
const fallback = document.getElementById('fallback');
const hint = document.getElementById('hint');

/* =======================
   3) PARSING CSV
   ======================= */
function detectDelimiter(headerLine){
  const commas = (headerLine.match(/,/g)||[]).length;
  const semis  = (headerLine.match(/;/g)||[]).length;
  const tabs   = (headerLine.match(/\t/g)||[]).length;
  if(tabs>commas && tabs>semis) return "\t";
  if(semis>commas) return ";";
  return ",";
}

function parseCSV(text){
  text = text.replace(/^\uFEFF/, "");
  const firstLine = text.split(/\r?\n/)[0] || "";
  const delim = detectDelimiter(firstLine);
  const rows = [];
  let cur = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(inQuotes){
      if(ch === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += ch;
    } else {
      if(ch === '"') inQuotes = true;
      else if(ch === delim){ cur.push(field); field = ""; }
      else if(ch === "\n"){ cur.push(field); rows.push(cur); cur=[]; field=""; }
      else if(ch === "\r"){ /* ignora */ }
      else field += ch;
    }
  }
  if(field.length || cur.length){ cur.push(field); rows.push(cur); }
  return rows;
}

// Data canonica "gg/mm/aaaa"; accetta ISO, gg/mm/aaaa, mm/dd/yyyy, seriale Excel
function normalizeDate(s){
  if(s === null || s === undefined) return "";
  s = String(s).trim();
  if(!s) return "";

  // ISO YYYY-MM-DD[ HH:MM:SS]
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[3]}/${m[2]}/${m[1]}`;

  // gg/mm/aaaa
  m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  if(m) return `${m[1]}/${m[2]}/${m[3]}`;

  // seriale Excel (es. 46028) -> data
  if(/^\d+(\.\d+)?$/.test(s)){
    const n = Number(s);
    if(n > 20000 && n < 80000){
      const ms = Math.round((n - 25569) * 86400 * 1000);
      const d = new Date(ms);
      return String(d.getUTCDate()).padStart(2,'0') + '/' +
             String(d.getUTCMonth()+1).padStart(2,'0') + '/' + d.getUTCFullYear();
    }
  }
  return s;
}

function normalizeTime(s){
  if(!s) return "";
  s = String(s).trim();
  let m = s.match(/^(\d{1,2}):(\d{2})/);
  if(m) return `${m[1].padStart(2,'0')}:${m[2]}`;
  return s;
}

function normalizeStudy(s){
  if(s === null || s === undefined) return "";
  s = String(s).trim();
  const n = parseInt(s, 10);
  return isNaN(n) ? "" : String(n);
}

function rowsToRecords(rows){
  if(!rows.length) return [];
  let headerIdx = -1;
  for(let i=0;i<Math.min(rows.length,10);i++){
    const joined = rows[i].join("|").toLowerCase();
    if(joined.includes("data") && joined.includes("operatore")){ headerIdx = i; break; }
  }
  if(headerIdx === -1) headerIdx = 0;

  const header = rows[headerIdx].map(h => String(h).trim().toLowerCase());
  const idx = {
    data:      header.findIndex(h => h === "data"),
    operatore: header.findIndex(h => h.startsWith("operatore")),
    dalle:     header.findIndex(h => h === "dalle"),
    alle:      header.findIndex(h => h === "alle"),
    studio:    header.findIndex(h => h === "studio"),
  };
  if(idx.data < 0)      idx.data = 0;
  if(idx.operatore < 0) idx.operatore = 2;
  if(idx.dalle < 0)     idx.dalle = 3;
  if(idx.alle < 0)      idx.alle = 4;
  if(idx.studio < 0)    idx.studio = 5;

  const out = [];
  for(let i=headerIdx+1;i<rows.length;i++){
    const r = rows[i];
    if(!r || r.length < 2) continue;
    const data      = r[idx.data]      || "";
    const operatore = r[idx.operatore] || "";
    const dalle     = r[idx.dalle]     || "";
    const alle      = r[idx.alle]      || "";
    const studio    = r[idx.studio]    || "";

    if(!String(data).trim() && !String(operatore).trim() && !String(studio).trim()) continue;
    const st = normalizeStudy(studio);
    if(!st || st === "0") continue;
    if(!String(dalle).trim() || !String(alle).trim()) continue;

    const date = normalizeDate(data);
    if(!/^\d{2}\/\d{2}\/\d{4}$/.test(date)) continue; // scarta date non interpretabili

    out.push({
      name:  String(operatore).trim(),
      date:  date,
      start: normalizeTime(dalle),
      end:   normalizeTime(alle),
      study: st
    });
  }
  return out;
}

/* =======================
   4) MESI DISPONIBILI
   Da gennaio dell'anno minimo nei dati (o anno corrente)
   fino al mese attuale; aggiunge eventuali mesi futuri presenti nei dati.
   ======================= */
function buildMonthOptions(recs){
  const now = new Date();
  const currentY = now.getFullYear();
  const currentM = now.getMonth() + 1;

  let minYear = currentY;
  const yearsInData = new Set();
  recs.forEach(r => {
    const m = r.date.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if(m) yearsInData.add(Number(m[3]));
  });
  if(yearsInData.size) minYear = Math.min(...yearsInData, currentY);

  const months = [];
  const key = (y,m)=> `${String(m).padStart(2,'0')}/${y}`;
  for(let y = minYear; y <= currentY; y++){
    const endM = (y === currentY) ? currentM : 12;
    for(let m = 1; m <= endM; m++) months.push(key(y,m));
  }

  // mesi futuri eventualmente presenti nei dati
  const futureSet = new Set();
  recs.forEach(r => {
    const mm = r.date.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if(!mm) return;
    const m = Number(mm[2]), y = Number(mm[3]);
    if(y > currentY || (y === currentY && m > currentM)){
      futureSet.add(`${y}-${String(m).padStart(2,'0')}`);
    }
  });
  Array.from(futureSet).sort().forEach(s=>{
    const [y,m] = s.split('-').map(Number);
    months.push(key(y,m));
  });

  const seen = new Set();
  return months.filter(k=>{ if(seen.has(k)) return false; seen.add(k); return true; })
               .map(v => [v,v]);
}

/* =======================
   5) RENDER
   ======================= */
function daysInMonth(v){ const [m,y]=v.split('/').map(Number); return new Date(y,m,0).getDate(); }
function showTip(e,r){
  tip.innerHTML='<b>'+(r.name||"(senza nome)")+'</b><br>Studio '+r.study+'<br>'+r.date+'<br>'+r.start+' – '+r.end;
  tip.style.display='block'; moveTip(e);
}
function moveTip(e){ tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px'; }
function hideTip(){ tip.style.display='none'; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function escapeAttr(s){ return escapeHtml(s); }

function renderLegend(){
  const names = Array.from(new Set(records.map(r=>r.name).filter(Boolean))).sort();
  legend.innerHTML = "";
  names.forEach(n=>{
    const x=document.createElement('div');
    x.className='legend-item';
    x.innerHTML='<span class="swatch" style="background:'+colorFor(n)+'"></span>'+n;
    legend.appendChild(x);
  });
}

function render(){
  const sel = ms.value;
  hint.style.display = "none";

  if(!sel){
    table.innerHTML = "";
    summary.textContent = "Nessun dato caricato.";
    return;
  }

  const [mm,yyyy] = sel.split('/');
  const n = daysInMonth(sel);
  const filtered = records.filter(r=>r.date.endsWith('/'+mm+'/'+yyyy));

  let h='<thead><tr><th class="study">Studio</th>';
  for(let d=1;d<=n;d++) h+='<th class="day-head">'+String(d).padStart(2,'0')+'</th>';
  h+='</tr></thead><tbody>';

  for(let s=1;s<=6;s++){
    h+='<tr><td class="study">'+s+'</td>';
    for(let d=1;d<=n;d++){
      const date = String(d).padStart(2,'0')+'/'+mm+'/'+yyyy;
      const rows = filtered.filter(r=>r.date===date && Number(r.study)===s);
      h+='<td class="cell">';
      rows.forEach(r=>{
        const c = colorFor(r.name);
        h+='<div class="booking" data-name="'+escapeAttr(r.name)+'" data-date="'+r.date+'" data-start="'+r.start+'" data-end="'+r.end+'" data-study="'+r.study+'" style="background:'+c+'">'
          + '<b>'+escapeHtml(r.name||"(senza nome)")+'</b>'
          + '<div class="time">'+r.start+' – '+r.end+'</div></div>';
      });
      if(!rows.length) h+='<span style="color:#c8cdd3">—</span>';
      h+='</td>';
    }
    h+='</tr>';
  }
  h+='</tbody>';
  table.innerHTML = h;

  table.querySelectorAll('.booking').forEach(el=>{
    const r = {
      name:  el.dataset.name,
      date:  el.dataset.date,
      start: el.dataset.start,
      end:   el.dataset.end,
      study: el.dataset.study
    };
    el.onmouseenter = e=>showTip(e,r);
    el.onmousemove  = moveTip;
    el.onmouseleave = hideTip;
  });

  summary.textContent = filtered.length + ' prenotazioni nel mese selezionato';

  if(records.length > 0 && filtered.length === 0){
    hint.style.display = "block";
    hint.innerHTML = 'Il mese <b>' + sel + '</b> non ha prenotazioni nei dati caricati (' +
      records.length + ' record totali). Usa il menu "Mese" per scegliere un mese con dati.';
  }
}

/* =======================
   6) APPLICA DATI
   ======================= */
function applyRecords(recs){
  records = Array.isArray(recs) ? recs : [];
  monthOptions = buildMonthOptions(records);

  ms.innerHTML = "";
  monthOptions.forEach(([v,l])=>{
    const o=document.createElement('option'); o.value=v; o.textContent=l; ms.appendChild(o);
  });

  if(monthOptions.length){
    // Preseleziona il mese con più prenotazioni.
    // Se preferisci il mese corrente, sostituisci con la variante commentata sotto.
    const counts = {};
    records.forEach(r=>{
      const m = r.date.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if(!m) return;
      const k = `${m[2]}/${m[3]}`;
      counts[k] = (counts[k]||0)+1;
    });
    let best = null, bestN = -1;
    Object.entries(counts).forEach(([k,v])=>{ if(v>bestN){ best=k; bestN=v; } });
    if(best && monthOptions.some(([v])=>v===best)){
      ms.value = best;
    } else {
      // Fallback: mese corrente se presente, altrimenti ultimo
      const now = new Date();
      const curKey = String(now.getMonth()+1).padStart(2,'0') + '/' + now.getFullYear();
      ms.value = monthOptions.some(([v])=>v===curKey) ? curKey : monthOptions[monthOptions.length-1][0];
    }

    /* Variante "mese corrente": decommenta per usarla
    const now = new Date();
    const curKey = String(now.getMonth()+1).padStart(2,'0') + '/' + now.getFullYear();
    ms.value = monthOptions.some(([v])=>v===curKey) ? curKey : monthOptions[monthOptions.length-1][0];
    */
  }

  renderLegend();
  render();
}

/* =======================
   7) CARICAMENTO
   ======================= */
async function tryLoadAuto(){
  try{
    const res = await fetch("dati.csv", {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    const recs = rowsToRecords(rows);
    if(recs.length === 0) throw new Error("Nessun record valido nel CSV");
    applyRecords(recs);
    fallback.style.display = "none";
  }catch(err){
    fallback.style.display = "block";
    summary.textContent = "In attesa del file CSV…";
    console.warn("Caricamento automatico fallito:", err);
  }
}

document.getElementById('fileInput').addEventListener('change', ev=>{
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const text = e.target.result;
    const recs = rowsToRecords(parseCSV(text));
    if(recs.length===0){ alert("Nessun record valido trovato nel file."); return; }
    applyRecords(recs);
    fallback.style.display = "none";
  };
  reader.readAsText(f, "UTF-8");
});

document.getElementById('pasteBtn').addEventListener('click', ()=>{
  const text = document.getElementById('pasteArea').value;
  if(!text.trim()){ alert("Incolla prima il contenuto del CSV."); return; }
  const recs = rowsToRecords(parseCSV(text));
  if(recs.length===0){ alert("Nessun record valido trovato."); return; }
  applyRecords(recs);
  fallback.style.display = "none";
});

ms.addEventListener('change', render);
tryLoadAuto();
</script></body></html>
